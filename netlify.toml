[build]
  command = "npm run build"
  publish = "dist"

# Netlify serves the same handler; the path shape matches the Vercel rewrite
# so the client does not have to know which host it is on.
[functions]
  directory = "api"

[[redirects]]
  from = "/api/sketchfab/*"
  to = "/.netlify/functions/sketchfab"
  status = 200
